  <script>
    window.__perfhand_db = null;
    // Promesse résolue dès qu'une session Firebase existe (anonyme ou réelle) — les écouteurs de
    // données l'attendent : branchés AVANT, ils étaient refusés par les règles et annulés pour de bon
    // lors d'une première visite. Filet : résolue quand même après 6 s (hors ligne, échec auth...).
    window.__perfhand_auth_pret = new Promise(function(res){
      window.__perfhand_auth_resoudre = res;
      setTimeout(res, 6000);
    });
    console.log("[Firebase] Initialisation...");
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyAB0dqrmBjZuZeLbBO2jVWRsECkzvFpVvg",
        authDomain: "perfhand-f8005.firebaseapp.com",
        databaseURL: "https://perfhand-f8005-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "perfhand-f8005",
        storageBucket: "perfhand-f8005.firebasestorage.app",
        messagingSenderId: "942276447358",
        appId: "1:942276447358:web:f47eb85391a07119ff5c2f",
      });
      window.__perfhand_db   = firebase.database();
      window.__perfhand_auth = firebase.auth();
      console.log('[PerfHand] Firebase OK:', window.__perfhand_db ? 'connecte' : 'echec');
      // Auth anonyme: permet aux joueurs connectes par code d'ecrire leur profil.
      // IMPORTANT: cette connexion anonyme automatique peut se resoudre EN RETARD (apres qu'une
      // vraie connexion email/mot de passe ait deja reussi), voire se redeclencher plus tard si
      // onAuthStateChanged refire pour une raison quelconque — dans les deux cas elle ecrasait la
      // session reelle par une session anonyme sans email. window.__perfhand_real_user_active reste
      // VRAI en permanence (pas juste le temps de la connexion) des qu'un vrai utilisateur est
      // authentifie, desactivant totalement l'auto-connexion anonyme pour le reste de la session.
      window.__perfhand_real_login_pending = false;
      window.__perfhand_real_user_active = false;
      window.__perfhand_auth.onAuthStateChanged(function(u){
        if (u) window.__perfhand_auth_resoudre();
        if (!u) {
          if (window.__perfhand_real_login_pending || window.__perfhand_real_user_active) return; // vraie session en cours ou active, ne pas interferer
          window.__perfhand_auth.signInAnonymously().catch(function(e){
            console.warn('[PerfHand] Auth anonyme echec:', e.code, e.message);
          });
        } else if (u.isAnonymous) {
          if (window.__perfhand_real_login_pending || window.__perfhand_real_user_active) {
            // Session anonyme indesirable pendant/apres une vraie connexion — on la vire immediatement.
            console.warn('[PerfHand] Session anonyme indesirable ignoree (vraie session active).');
            window.__perfhand_auth.signOut().catch(function(){});
          } else {
            console.log('[PerfHand] Auth OK uid:', u.uid, '(anonyme)');
          }
        } else {
          console.log('[PerfHand] Auth OK uid:', u.uid);
          window.__perfhand_real_login_pending = false;
          window.__perfhand_real_user_active = true;
        }
      });
    } catch(e) {
      console.error('[PerfHand] Firebase erreur:', e.message);
    }
